<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>MTA Food House — Weiterleitung...</title>
    <script type="text/javascript">
      // GitHub Pages SPA Hash Redirect
      var path = window.location.pathname;
      var repo = '/tv_banner';

      if (path.indexOf(repo) === 0) {
        var subpath = path.slice(repo.length);
        if (subpath === '/admin' || subpath === '/admin/') {
          window.location.replace(repo + '/#/admin' + window.location.search);
        } else {
          window.location.replace(repo + '/#' + subpath + window.location.search);
        }
      } else {
        window.location.replace('/tv_banner/');
      }
    </script>
  </head>
  <body style="background: #F9F6E8; color: #005826; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Weiterleitung zum Digital Menu Board...</p>
  </body>
</html>
